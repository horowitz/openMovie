plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.compose)
    id 'jacoco'
    alias(libs.plugins.hilt)
    alias(libs.plugins.ksp)
}

apply from: "$rootDir/libraries/common/gradle/android.gradle"
apply from: "$rootDir/libraries/common/gradle/feature.gradle"
apply from: "$rootDir/libraries/common/gradle/jacoco.gradle"

android {
    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
    }
    testOptions {
        animationsDisabled = true
    }
    buildFeatures {
        viewBinding = true
    }
    defaultConfig {

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }
    namespace = 'com.dhorowitz.openmovie.moviedetails'
}

dependencies {
    implementation project(path: ":libraries:ui")
    implementation project(path: ':libraries:navigation')
    implementation project(path: ':libraries:common')
    implementation project(path: ':libraries:network')
    debugImplementation project(path: ':libraries:test')
    testImplementation project(path: ':libraries:test')

}
