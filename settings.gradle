pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Settings plugins load before the project's version catalog is available.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Open Movie'
include ':app'
include ':libraries:navigation', ':libraries:common', ':libraries:network', ':libraries:test', ':libraries:ui'
include ':features:discover', ':features:moviedetails'
