apply plugin: 'jacoco'

jacoco {
    toolVersion = libs.versions.jacoco.get()
    reportsDirectory = file("$buildDir/reports/coverage")
}


android {
    testCoverage {
        jacocoVersion = libs.versions.jacoco.get()
    }
}

tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    mustRunAfter 'connectedDebugAndroidTest'

    def defaultExclusions = [
            '**/R.*',
            '**/R$*.*',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*_MembersInjector.*',
            '**/di/**/*.*',
            '**/Dagger*Component.*',
            '**/Dagger*Component$Builder.*',
            '**/*Module_*Factory.*',
            '**/*Adapter*.*',
            '**/*ViewPager*.*',
            '**/*ViewHolder*.*',
            '**/*_Provide*/**',
            '**/*_Factory*/**'
    ]

    def moduleExclusions = getModuleExclusions()

    defaultExclusions.addAll(moduleExclusions.split(','))

    // Hilt transforms activity superclasses before coverage instrumentation.
    // Report against those exact classes rather than the raw compiler output.
    classDirectories.setFrom(fileTree(
            dir: layout.buildDirectory.dir('intermediates/classes/debug/transformDebugClassesWithAsm/dirs'),
            excludes: defaultExclusions
    ))
    sourceDirectories.setFrom(files('src/main/kotlin', 'src/main/java'))
    // Instrumentation data is included when connectedDebugAndroidTest ran beforehand.
    executionData.setFrom(fileTree(layout.buildDirectory) {
        include 'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
        include 'outputs/code_coverage/debugAndroidTest/connected/**/coverage.ec'
    })

    reports {
        xml.required = true
        html.required = true
    }

}

private String getModuleExclusions() {
    def defaultExclusion = "**/di/**/*,"
    def propertyKey = "module.coverage.exclusions"

    if (hasProperty(propertyKey)) {
        return defaultExclusion + getProperty(propertyKey)
    }
    return defaultExclusion
}
