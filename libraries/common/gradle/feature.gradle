android {
    defaultConfig {
        testInstrumentationRunner = 'com.dhorowitz.openmovie.test.dagger.CustomTestRunner'
    }
    buildFeatures {
        compose = true
    }
}

// Lint resolves Hilt test factories from KSP's output. Wait for regeneration
// before reading those files, including during a combined build/test-APK build.
tasks.matching { it.name == 'lintAnalyzeDebugAndroidTest' }.configureEach {
    dependsOn 'kspDebugAndroidTestKotlin'
}

dependencies {
    implementation platform(libs.compose.bom)
    androidTestImplementation platform(libs.compose.bom)
    implementation platform(libs.okhttp.bom)

    implementation libs.compose.ui
    implementation libs.compose.tooling.preview
    debugImplementation libs.compose.tooling
    implementation libs.compose.foundation
    implementation libs.compose.material
    implementation libs.compose.material3
    implementation libs.compose.icons
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.material
    implementation libs.coroutines.core
    implementation libs.coroutines.android
    implementation libs.retrofit
    implementation libs.okhttp
    implementation libs.serialization.json
    implementation libs.coil.compose
    implementation libs.coil.network
    implementation libs.timber

    implementation libs.hilt.android
    ksp libs.hilt.compiler
    androidTestImplementation libs.hilt.testing
    kspAndroidTest libs.hilt.compiler

    testImplementation libs.junit
    testImplementation libs.arch.testing
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.coroutines.test

    androidTestImplementation libs.compose.ui.test
    debugImplementation libs.compose.test.manifest
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.intents
    androidTestImplementation libs.barista
}
