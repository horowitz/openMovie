name: Instrumentation and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 27
            arch: x86
          - api-level: '37.0'
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation and generate coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest jacocoTestReport --no-parallel --console=plain
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/reports/coverage/
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/jacocoTestReport/jacocoTestReport.xml,features/discover/build/reports/coverage/jacocoTestReport/jacocoTestReport.xml,features/moviedetails/build/reports/coverage/jacocoTestReport/jacocoTestReport.xml
          flags: android-api-${{ matrix.api-level }}
